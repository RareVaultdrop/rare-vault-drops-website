<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RVD Giveaway Sheet Test</title>
<style>
body{font-family:Arial,sans-serif;background:#100817;color:white;display:grid;place-items:center;min-height:100vh;margin:0}
.card{width:min(92vw,520px);padding:28px;border:1px solid #9b27ff;border-radius:20px;background:#190b28}
input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 14px;border-radius:10px}
button{background:#8e2cff;color:#fff;font-weight:800;border:0;cursor:pointer}
small{color:#d4b3ff}
</style>
</head>
<body>
<div class="card">
<h1>RVD Sheet Test</h1>
<p>This page tests Google Sheet logging only. The row will be marked as a test entry.</p>
<form id="t">
<label>Name</label><input name="full_name" value="RVD TEST ENTRY" required>
<label>Email</label><input name="email" type="email" placeholder="Use an email you can identify" required>
<label>Phone</label><input name="phone" value="000-000-0000">
<input type="hidden" name="age_confirmed" value="Yes">
<input type="hidden" name="rules_accepted" value="Yes">
<button type="submit">SEND TEST TO SHEET</button>
</form>
<p id="s"></p>
<small>Delete this file from GitHub after the test.</small>
</div>
<script>
const endpoint = "https://script.google.com/macros/s/AKfycbyRHsJiM9vSPk0OA5mxbT9bx7Lk4WknaViCWqK6Jr8LjVuCTf_kTgtD8EGyv-p2y-k1/exec";
document.getElementById('t').addEventListener('submit', async (e) => {
  e.preventDefault();
  const s = document.getElementById('s');
  s.textContent = 'Sending...';
  const data = new URLSearchParams(new FormData(e.target));
  data.set('promotion','RVD TEST ONLY - DELETE THIS ROW');
  data.set('entry_id','TEST-' + Date.now());
  data.set('entry_time',new Date().toISOString());
  try {
    await fetch(endpoint, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
      body:data.toString()
    });
    s.textContent = 'Test sent. Check the Entries tab in Google Sheets.';
  } catch(err) {
    s.textContent = 'Test could not be sent. ' + err;
  }
});
</script>
</body>
</html>
